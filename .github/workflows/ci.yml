name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run API suite with JaCoCo
        run: mvn -B -ntp -Pci,api verify
      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          missed = sum(int(r["LINE_MISSED"]) for r in rows)
          covered = sum(int(r["LINE_COVERED"]) for r in rows)
          total = missed + covered
          pct = 100.0 * covered / total if total else 0.0
          print("### API suite line coverage")
          print(f"**{pct:.1f}%** ({covered} of {total} lines in the demo app)")
          PY
          fi
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results
          if-no-files-found: ignore
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  ui-tests:
    name: UI + end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run UI + e2e suite (headless Chrome)
        run: mvn -B -ntp -Pci,ui test
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: target/allure-results
          if-no-files-found: ignore

  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare report folder
        run: mkdir -p docs/security && chmod 777 docs/security
      - name: Start the app in Docker
        run: docker compose up -d --build --wait warehouse-app
      - name: ZAP baseline scan (reports findings, does not fail the build)
        run: docker compose --profile security run --rm zap
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: docs/security
          if-no-files-found: ignore
      - name: Stop containers
        if: always()
        run: docker compose down

  report:
    name: Publish Allure report to GitHub Pages
    needs: [api-tests, ui-tests]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true   # stays green if Pages is not enabled yet
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Install Allure CLI
        run: |
          curl -fsSL -o allure.zip https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.zip
          unzip -q allure.zip
          echo "$PWD/allure-2.29.0/bin" >> "$GITHUB_PATH"
      - name: Generate report
        run: allure generate allure-results --clean -o allure-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v4
