name: Flaky-test check

# Runs the full regression three times on separate runners and compares the results.
# Tests that pass in one run and fail (or need a retry) in another are listed in the job summary.
on:
  schedule:
    - cron: '0 2 * * 1'   # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: Regression run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Full regression (headless)
        run: mvn -B -ntp -Pci test
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.run }}
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore

  report:
    name: Compare runs
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: surefire-*
          path: runs
      - name: List unstable tests
        run: python3 scripts/flaky_report.py runs >> "$GITHUB_STEP_SUMMARY"
